version: v2
clean: true
plugins:
  # Pinned remote plugins (not local $PATH binaries) so codegen is reproducible across
  # machines and CI. protocolbuffers/go is pinned to the same version as the protobuf
  # runtime in go.mod to avoid plugin/runtime skew.
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: api/genpb
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: api/genpb
    opt: paths=source_relative
