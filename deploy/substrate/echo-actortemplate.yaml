# Stateless-tier substrate manifests: the echo harness packaged as a gVisor ActorTemplate + WorkerPool.
#
# Grounded in agent-substrate demos/counter/counter.yaml.tmpl (the gVisor variant). STATELESS_REPLAY is the
# STATELESS_REPLAY path: the harness holds no in-RAM state, so the actor is cold-booted
# (ResumeActor{boot:true}) and the external agentsessions controller replays the durable journal —
# no memory snapshot. This is the direct substrate analog of runtime/local, and the cheapest
# always-green conformance path. REQUIRES_MEMORY_SNAPSHOT on a micro-VM is the other tier.
#
# gVisor is the default sandbox class (no explicit sandboxClass, matching the gVisor counter). The
# harness image is built from this repo via `ko`; the worker image is substrate's ateom-gvisor.
#
# The `workload` label is repo-scoped on purpose: worker eligibility ignores namespaces and matches
# labels across every pool in the cluster, so a label shared with a substrate demo pool would let the
# scheduler place our actor there. See counter-microvm-actortemplate.yaml for the full trace.

apiVersion: v1
kind: Namespace
metadata:
  name: ate-agentsessions

---

apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: echo-harness
  namespace: ate-agentsessions
  labels:
    workload: agentsessions-echo-harness
spec:
  replicas: 2
  ateomImage: ko://github.com/agent-substrate/substrate/cmd/ateom-gvisor

---

apiVersion: ate.dev/v1alpha1
kind: ActorTemplate
metadata:
  name: echo-harness
  namespace: ate-agentsessions
spec:
  pauseImage: "registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4"
  containers:
  - name: harness
    # Built from this repo by ko. Serves the echo harness over the harnesswire gRPC Harness.Connect
    # stream on :80 (the port the atenet mesh routes to); the controller dials the actor's mesh DNS.
    image: ko://github.com/aramase/agentsessions/cmd/harnessnode
    command:
    - /ko-app/harnessnode
    # ResumeActor blocks on this probe, so the controller only dials once the gRPC server is live.
    readyz:
      httpGet:
        path: /readyz
        port: 8081
  workerSelector:
    matchLabels:
      workload: agentsessions-echo-harness
  # A stateless-replay harness keeps no durable in-actor state (the event log is the state), so there
  # is no durable-dir volume. The ActorTemplate still builds a golden snapshot to reach Ready, so
  # onCommit must be Full (a full `runsc checkpoint`): DATA scope snapshots durable-dir volumes and
  # fails closed when there are none. stateless actors boot fresh (boot:true) and replay the journal, so
  # the golden's memory image is never restored -- but it must build for the template to go Ready.
  snapshotsConfig:
    onPause: Full
    onCommit: Full
    location: gs://ate-snapshots/ate-agentsessions/
