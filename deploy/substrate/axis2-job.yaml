# Axis-2 conformance as an in-cluster Job: memory continuity across suspend/restore on the micro-VM
# sandbox class — the differentiator a plain pod cannot do. Mirrors axis1-job.yaml (Control over the
# ate-api-server ClusterIP + a mounted SA token, harness over PodIP:HarnessPort), but drives the in-RAM
# counter (REQUIRES_MEMORY_SNAPSHOT) placed on the counter-microvm ActorTemplate: drive to N ->
# SuspendActor -> ResumeActor{boot:false} -> assert continuity (N+1), no double-application, chain
# verify across the boundary, and a fresh-fence append.
apiVersion: batch/v1
kind: Job
metadata:
  name: axis2-conformance
  namespace: ate-agentsessions
spec:
  backoffLimit: 0 # no retries: a failed conformance run must fail loudly, not be masked by a retry
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: axis2-conformance
    spec:
      restartPolicy: Never
      containers:
        - name: axis2
          image: ko://github.com/aramase/agentsessions/integrations/substrate/cmd/axis2
          env:
            - name: ATEAPI_ADDR
              value: "api.ate-system.svc:443"
            - name: ATEAPI_SERVER_NAME
              value: "api.ate-system.svc"
            - name: ATEAPI_TOKEN_FILE
              value: "/var/run/secrets/tokens/ateapi-token"
            - name: SUBSTRATE_ATESPACE
              value: "axis2"
            - name: ACTORTEMPLATE_NS
              value: "ate-agentsessions"
            - name: ACTORTEMPLATE_NAME
              value: "counter-microvm"
            - name: AXIS2_TURNS
              value: "3"
          volumeMounts:
            - name: ateapi-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
      volumes:
        - name: ateapi-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: api.ate-system.svc
                  expirationSeconds: 3600
                  path: ateapi-token
