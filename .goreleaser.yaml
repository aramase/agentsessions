# Release build for the two user-facing binaries.
#
# agentnode and harnessnode are deliberately absent: they are demo and conformance scaffolding, and
# shipping them as release artifacts would present them as products people should run.
version: 2

before:
  hooks:
    - go mod download

builds:
  - id: agentctl
    main: ./cmd/agentctl
    binary: agentctl
    env:
      # The sqlite driver is pure Go (modernc), so a static build needs no cgo and the artifacts
      # cross-compile without a toolchain per target.
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/aramase/agentsessions/internal/version.version={{.Version}}
      - -X github.com/aramase/agentsessions/internal/version.commit={{.FullCommit}}
      - -X github.com/aramase/agentsessions/internal/version.date={{.Date}}

  - id: agentsessionsd
    main: ./cmd/agentsessionsd
    binary: agentsessionsd
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/aramase/agentsessions/internal/version.version={{.Version}}
      - -X github.com/aramase/agentsessions/internal/version.commit={{.FullCommit}}
      - -X github.com/aramase/agentsessions/internal/version.date={{.Date}}

  # Built for the image only; it is not a user-facing CLI, so it is not archived below.
  - id: harnessnode
    main: ./cmd/harnessnode
    binary: harnessnode
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/aramase/agentsessions/internal/version.version={{.Version}}
      - -X github.com/aramase/agentsessions/internal/version.commit={{.FullCommit}}
      - -X github.com/aramase/agentsessions/internal/version.date={{.Date}}

# Container images, so a deployment does not have to build its own.
#
# ko builds straight from the Go packages: no Dockerfile, reproducible, and multi-arch from one
# invocation. The base is distroless static rather than ko's default, because substrate's node-local
# image cache rejects the char-device entries the default base ships. That constraint lives in
# .ko.yaml for local `ko build`; it is repeated here because goreleaser passes its own base.
kos:
  - id: agentsessionsd
    build: agentsessionsd
    main: ./cmd/agentsessionsd
    base_image: gcr.io/distroless/static-debian13
    # Non-root: the server binds an unprivileged port and only needs to write its journal, which a
    # deployment grants with fsGroup. harnessnode below cannot do this, because the substrate mesh
    # routes to port 80 and binding it requires root.
    user: "65532:65532"
    repositories:
      - ghcr.io/aramase/agentsessions/agentsessionsd
    # Without this, ko derives the repository from the Go import path and appends an MD5 hash under
    # KO_DOCKER_REPO, which is how v0.1.1 published agentsessionsd-<hash> and left the documented
    # name a 404.
    bare: true
    platforms: [linux/amd64, linux/arm64]
    tags:
      # v-prefixed to match the git tag and the release archives, so one string identifies a
      # release everywhere.
      - "{{ .Tag }}"
      # Only a final release moves the floating tag: a prerelease pushing it would silently upgrade
      # anyone tracking latest.
      - "{{ if not .Prerelease }}latest{{ end }}"
    creation_time: "{{ .CommitTimestamp }}"
    ko_data_creation_time: "{{ .CommitTimestamp }}"
    sbom: spdx
    labels: &image_labels
      org.opencontainers.image.source: https://github.com/aramase/agentsessions
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: Apache-2.0

  # The in-sandbox harness, referenced by the substrate ActorTemplates. Publishing it is what lets a
  # deployment apply those manifests without first building and pushing an image of its own.
  - id: harnessnode
    build: harnessnode
    main: ./cmd/harnessnode
    base_image: gcr.io/distroless/static-debian13
    repositories:
      - ghcr.io/aramase/agentsessions/harnessnode
    bare: true
    platforms: [linux/amd64, linux/arm64]
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    creation_time: "{{ .CommitTimestamp }}"
    ko_data_creation_time: "{{ .CommitTimestamp }}"
    sbom: spdx
    labels: *image_labels

archives:
  - formats: [tar.gz]
    # Only the user-facing CLIs are archived; harnessnode ships as an image.
    ids: [agentctl, agentsessionsd]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# One SBOM per archive, so a consumer can inventory exactly what they downloaded rather than infer
# it from the source tree.
sboms:
  - artifacts: archive

changelog:
  use: github
  sort: asc
  # Link every entry to its commit. The default renders a bare 40-character SHA, which GitHub does
  # not turn into a link in a release body, so the most useful reference in each line is unreachable.
  # Abbreviating keeps the line readable; a short SHA still resolves.
  abbrev: 7
  format: "[`{{ .SHA }}`](https://github.com/aramase/agentsessions/commit/{{ .SHA }}) {{ .Message }}"
  # Conventional Commits are enforced by convention in CONTRIBUTING, so the notes group by type
  # rather than dumping a flat list.
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Documentation
      regexp: '^docs(\(.+\))?!?:'
      order: 2
    - title: Build and CI
      regexp: '^(build|ci)(\(.+\))?!?:'
      order: 3
    - title: Other
      order: 99
  filters:
    exclude:
      - '^test(\(.+\))?:'
      - '^chore\(deps\):'
      # Merge commits restate a change the squashed commit already describes, so listing both says
      # the same thing twice.
      - '^Merge pull request'
      - '^Merge branch'

release:
  # v0.x is pre-1.0 and makes no compatibility promise, which the release notes should say rather
  # than leaving a reader to infer it from the version number.
  header: |
    ## agentsessions {{ .Tag }}

    Pre-1.0: the wire contract and the Go SPI may both change. `agentsessions.v1` is a proto
    namespace, not a stability promise.

    There is no authentication, authorization, or transport security. Do not expose a host to an
    untrusted network or treat it as multi-tenant. See `docs/security.md`.
  footer: |
    **Verify an artifact**

    Every archive is checksummed, and each carries an SBOM alongside it:

    ```
    sha256sum -c checksums.txt --ignore-missing
    ```

    Public releases also carry signed build provenance, which ties an archive to the workflow,
    commit, and runner that produced it:

    ```
    gh attestation verify <file> --repo {{ .Env.GITHUB_REPOSITORY }}
    ```

    **Container images**

    ```
    ghcr.io/aramase/agentsessions/agentsessionsd:{{ .Tag }}
    ghcr.io/aramase/agentsessions/harnessnode:{{ .Tag }}
    ```

    Multi-arch (amd64 and arm64), built with ko from the tagged source, each with an SBOM pushed
    alongside it. `agentsessionsd` runs as uid 65532; give its journal path a writable volume.
