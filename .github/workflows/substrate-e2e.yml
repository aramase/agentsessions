# Real-substrate conformance in kind. Heavy (kind + KVM + ate-system + micro-VM assets) but ~15 min and
# stable, so it gates every PR as well as running nightly. It copies agent-substrate's own
# pr-workflow.yaml recipe (free-disk, /dev/kvm udev rule, kind bring-up).
#
# The suite is an ordinary Go test package (integrations/substrate/e2e), compiled with `go test -c`
# and run as an in-cluster Job. In-cluster is required, not preferred: the atenet mesh is HTTP/1.1-only
# to actors (Q1 resolved), so a harness is reached by a direct gRPC dial to the actor's PodIP:80,
# not the router. A new capability is therefore a new Test function — not another driver
# binary, another Job manifest, and another copy of the polling shell.
#
# It runs in two passes against one cluster so the cheap tier fails fast:
#   1. stateless tier — gVisor + the echo harness + ResumeActor{boot:true} + byte-identical replay.
#   2. stateful tier + fork, after the micro-VM class is staged (substrate's run-microvm-demo-kind
#      recipe, kata + cloud-hypervisor asset cache): the in-RAM counter driven to N, suspended to a
#      memory snapshot and continued at N+1 — which no journal replay could reconstruct — then forked
#      k ways, with every child required to continue at N+1 independently.
name: substrate-e2e

on:
  push:
    branches: [main]
  pull_request:
    # The live cluster e2e is heavy; skip it for changes that cannot affect substrate conformance
    # (docs, the demo UI, and demo media). Any code, deploy, or workflow change still runs it, and
    # push to main plus the nightly schedule always run the full suite.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "cmd/agentui/**"
      - "demos/**"
  schedule:
    - cron: "0 7 * * *" # nightly, so a green main is re-proven against a fresh cluster
  workflow_dispatch: {}

permissions:
  contents: read

# One cluster run per ref: a new push supersedes the in-flight run rather than burning a second
# cluster alongside it. Scheduled and main runs key on their own ref and are a day apart.
concurrency:
  group: substrate-e2e-${{ github.ref }}
  cancel-in-progress: true

# The agent-substrate commit our adapter's go.mod pins; keep them in lockstep so the cluster's
# ateapi and our generated client agree. The pin is boxed in on both sides. Floor: it must be at or
# past the ActorSnapshot lifecycle APIs (substrate #570), which the fork path clones through.
# Ceiling: it must stay before cc858876 "worker: serve actor ingress through atunnel", which deletes
# the PodIP:80 -> actor DNAT the harness dial needs and leaves only an mTLS listener that none but
# the atenet router may call. The router reverse-proxies HTTP/1.1, so it cannot carry the harness
# gRPC stream (agent-substrate#254). Do not bump this ref until #484's h2c ingress lands; see
# docs/substrate-conformance.md.
env:
  SUBSTRATE_REF: b1bd558aba3c
  KO_DOCKER_REPO: localhost:5001
  E2E_IMAGE: localhost:5001/agentsessions-e2e:${{ github.sha }}

jobs:
  substrate-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agentsessions
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup ko
        uses: ko-build/setup-ko@v0.7

      - name: Clone agent-substrate (pinned)
        run: |
          git clone https://github.com/agent-substrate/substrate _substrate
          git -C _substrate checkout "${SUBSTRATE_REF}"

      - name: Relax ate-system rollout timeouts
        # install-ate.sh waits on deployment/ate-api-server BEFORE statefulset/valkey-cluster, but the
        # api-server crash-loops until valkey has formed a cluster ("redis: cluster has no nodes"). With
        # the upstream 120s budget, whether the api-server converges in time is down to how fast the
        # runner pulls images, which made the gate flaky. `rollout status` returns as soon as the
        # rollout is ready, so a larger budget costs nothing on a healthy cluster and only buys slack on
        # a cold one. Applied to the pinned clone, so it is deterministic.
        working-directory: _substrate
        run: sed -i 's/--timeout=120s/--timeout=600s/g' hack/install-ate.sh

      - name: Cache micro-VM assets (kata-static + cloud-hypervisor + virtiofsd)
        # Assembling the assets is fully pinned by assemble.sh (all downloads on amd64), so key the
        # cache on its hash. run-microvm-demo-kind.sh skips assembling when these are present.
        uses: actions/cache@v4
        with:
          path: _substrate/bin/microvm-assets/amd64
          key: microvm-assets-amd64-${{ hashFiles('_substrate/hack/microvm-assets/assemble.sh') }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Enable KVM
        # Grant /dev/kvm via the udev rule substrate's CI uses: the stateful tier's micro-VM (kata + cloud-
        # hypervisor) needs it, and create-kind-cluster.sh mounts it into the node. (gVisor does not.)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create kind cluster + install ate-system
        working-directory: _substrate
        run: |
          hack/create-kind-cluster.sh
          # token auth is the simpler first cut (spike §3e); cert is a later matrix dimension.
          hack/install-ate-kind.sh --deploy-ate-system --ateapi-client-auth=token

      - name: Build the harness image (shared by both conformance tiers)
        # Both tiers run the same harnessnode image (HARNESS_KIND selects echo vs counter), so build
        # and push it to the local registry once and reuse the ref, instead of ko-building it twice.
        # The manifests name the published image so they apply as written; this overrides it with a
        # build of the commit under test, which is the whole point of running conformance in CI.
        run: echo "HARNESS_IMG=$(ko build ./cmd/harnessnode)" >> "$GITHUB_ENV"

      - name: Build + apply the echo harness ActorTemplate + WorkerPool
        # The harness image is built once (above); resolve substrate's ateom-gvisor in its own module,
        # substitute both refs into the manifest, apply.
        run: |
          ATEOM_IMG="$(cd _substrate && ko build ./cmd/ateom-gvisor)"
          echo "ATEOM_GVISOR_IMG=${ATEOM_IMG}" >> "$GITHUB_ENV"
          sed -e "s#ghcr.io/aramase/agentsessions/harnessnode:latest#${HARNESS_IMG}#" \
              -e "s#ko://github.com/agent-substrate/substrate/cmd/ateom-gvisor#${ATEOM_IMG}#" \
              deploy/substrate/echo-actortemplate.yaml | kubectl --context kind-kind apply -f -
          kubectl --context kind-kind wait --for=condition=Ready \
            actortemplate/echo-harness -n ate-agentsessions --timeout=600s
          hack/wait-worker-pool.sh echo-harness

      - name: Allow the conformance Job to reach worker pods
        # substrate's per-WorkerPool NetworkPolicy admits only the atenet-router. The suite dials the
        # actor directly because the router cannot carry the harness gRPC stream (agent-substrate#254),
        # so union in one extra peer. Applied after the WorkerPools exist, though ordering is not
        # load-bearing: a NetworkPolicy selects pods whenever they appear.
        run: kubectl --context kind-kind apply -f deploy/substrate/e2e-netpol.yaml

      - name: Build the conformance test binary image
        # `go test -c` rather than ko: this is a test binary, and ko builds main packages. Static
        # (CGO_ENABLED=0, pure-Go sqlite), pushed to the same local registry kind pulls from.
        run: |
          cd integrations/substrate
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -c -o "${RUNNER_TEMP}/e2e.test" ./e2e
          cp ../../deploy/substrate/Dockerfile.e2e "${RUNNER_TEMP}/Dockerfile"
          docker build -t "${E2E_IMAGE}" "${RUNNER_TEMP}"
          docker push "${E2E_IMAGE}"

      - name: Stateless-tier conformance (in-cluster Job)
        # Runs before the expensive micro-VM staging below, so a break in the cheap tier fails fast.
        run: hack/run-e2e-job.sh 'TestStatelessReplayOnGVisor' "${E2E_IMAGE}" 600

      - name: Build the production-shaped control-plane and model fixture images
        run: |
          echo "CONTROL_IMG=$(cd integrations/substrate && ko build ./cmd/controlplane)" >> "$GITHUB_ENV"
          echo "MODELSTUB_IMG=$(cd integrations/substrate && ko build ./cmd/modelstub)" >> "$GITHUB_ENV"

      - name: Deploy the chat harness ActorTemplate + WorkerPool
        run: |
          sed -e "s#ghcr.io/aramase/agentsessions/harnessnode:latest#${HARNESS_IMG}#" \
              -e "s#ko://github.com/agent-substrate/substrate/cmd/ateom-gvisor#${ATEOM_GVISOR_IMG}#" \
              -e "s#MODEL_NAME#smoke-model#g" \
              deploy/substrate/kind/chat-actortemplate.yaml | kubectl --context kind-kind apply -f -
          kubectl --context kind-kind wait --for=condition=Ready \
            actortemplate/chat-harness -n ate-agentsessions --timeout=600s
          hack/wait-worker-pool.sh chat-harness

      - name: Deploy the deterministic smoke model
        run: |
          kubectl --context kind-kind create configmap agentsessions-model -n ate-agentsessions \
            --from-literal=project=smoke \
            --from-literal=model=smoke-model \
            --from-literal=base-url=http://modelstub.ate-agentsessions.svc:8080/v1 \
            --from-literal=path=/chat/completions \
            --from-literal=auth-header=Authorization \
            --dry-run=client -o yaml | kubectl --context kind-kind apply -f -
          sed -e "s#MODELSTUB_IMAGE#${MODELSTUB_IMG}#" \
            deploy/substrate/kind/modelstub.yaml | kubectl --context kind-kind apply -f -
          kubectl --context kind-kind rollout status deployment/modelstub \
            -n ate-agentsessions --timeout=300s

      - name: Deploy the persistent Sessions control plane
        run: |
          sed -e "s#ghcr.io/aramase/agentsessions/controlplane:latest#${CONTROL_IMG}#" \
            deploy/substrate/kind/control-plane.yaml | kubectl --context kind-kind apply -f -
          kubectl --context kind-kind rollout status deployment/agentsessions \
            -n ate-agentsessions --timeout=600s

      - name: Production-shaped restart smoke
        run: EXPECT_MODELSTUB=1 hack/smoke-production-kind.sh

      - name: Deploy the micro-VM sandbox class
        # run-microvm-demo-kind stages the (cached) kata-assets into rustfs and installs the
        # cluster-scoped micro-VM SandboxConfig our counter-microvm ActorTemplate reuses. It also
        # re-applies ate-system (idempotent) and deploys substrate's own counter demo, which brings up
        # a competing micro-VM WorkerPool in ate-demo-counter-microvm. That pool is only inert because
        # our WorkerPool labels are repo-scoped: worker eligibility is label-matched cluster-wide with
        # no namespace filter, so a shared `workload` value would let our actor land on the demo pool.
        working-directory: _substrate
        run: hack/run-microvm-demo-kind.sh --ateapi-client-auth=token

      - name: Build + apply the counter harness micro-VM ActorTemplate + WorkerPool
        # Reuses the harness image built once above (HARNESS_IMG); builds substrate's ateom-microvm.
        run: |
          ATEOM_MV_IMG="$(cd _substrate && ko build ./cmd/ateom-microvm)"
          sed -e "s#ghcr.io/aramase/agentsessions/harnessnode:latest#${HARNESS_IMG}#" \
              -e "s#ko://github.com/agent-substrate/substrate/cmd/ateom-microvm#${ATEOM_MV_IMG}#" \
              deploy/substrate/counter-microvm-actortemplate.yaml | kubectl --context kind-kind apply -f -
          kubectl --context kind-kind wait --for=condition=Ready \
            actortemplate/counter-microvm -n ate-agentsessions --timeout=600s
          hack/wait-worker-pool.sh counter-microvm

      - name: Stateful-tier + fork conformance (in-cluster Job)
        # Memory continuity across suspend/restore (the differentiator a plain pod cannot do), and
        # fork: fan out k children from one parent checkpoint and require each to continue at N+1
        # independently — the claim that a stateful fork clones RAM instead of silently cold-booting.
        run: hack/run-e2e-job.sh 'TestMemorySnapshotSuspendResume|TestFork' "${E2E_IMAGE}" 1500

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl --context kind-kind get actortemplate,workerpool,jobs,pods -A -o wide || true
          for ns in ate-agentsessions ate-system; do
            for p in $(kubectl --context kind-kind get pods -n "$ns" -o name 2>/dev/null); do
              echo "=== logs: $ns/$p ==="
              kubectl --context kind-kind logs -n "$ns" "$p" --all-containers --tail=200 2>/dev/null || true
            done
          done
