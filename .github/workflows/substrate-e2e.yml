# Real-substrate conformance in kind. Heavy (kind + KVM + ate-system + micro-VM assets), so it gates
# every PR as well as running nightly. It copies agent-substrate's own pr-workflow.yaml recipe
# (free-disk, /dev/kvm udev rule, kind bring-up).
#
# The suite is an ordinary Go test package (integrations/substrate/e2e), compiled with `go test -c`
# and run as an in-cluster Job. It reaches each harness the way a production host does: harnesswire
# over h2c to the atenet-router Service, with the ate-target-actor metadata naming the actor. A new
# capability is a new Test function, not another driver binary, Job manifest, or polling shell.
#
# ActorTemplates are substrate API resources, not Kubernetes objects, so the suite creates its own
# through Control with the harness image built here; the workflow only applies the WorkerPools.
#
# Both tiers run on the micro-VM sandbox class, so the suite exercises the same isolation class in
# both and covers the micro-VM path end to end. The class is staged once (substrate's
# run-microvm-demo-kind recipe) before any tier runs. The suite then runs in passes against one
# cluster so the cheap tier fails first:
#   1. stateless tier: the echo harness + byte-identical replay, and a suspend under an idle stream.
#   2. idle stream: one harness stream held idle past the router's 5m route timeout.
#   3. stateful tier + fork: the in-RAM counter driven to N, suspended to a memory snapshot and
#      continued at N+1, which no journal replay could reconstruct, then forked k ways, with every
#      child required to continue at N+1 independently.
name: substrate-e2e

on:
  push:
    branches: [main]
  pull_request:
    # The live cluster e2e is heavy; skip it for changes that cannot affect substrate conformance
    # (docs, the demo UI, and demo media). Any code, deploy, or workflow change still runs it, and
    # push to main plus the nightly schedule always run the full suite.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "cmd/agentui/**"
      - "demos/**"
  schedule:
    - cron: "0 7 * * *" # nightly, so a green main is re-proven against a fresh cluster
  workflow_dispatch: {}

permissions:
  contents: read

# One cluster run per ref: a new push supersedes the in-flight run rather than burning a second
# cluster alongside it. Scheduled and main runs key on their own ref and are a day apart.
concurrency:
  group: substrate-e2e-${{ github.ref }}
  cancel-in-progress: true

# The agent-substrate commit our adapter's go.mod pins; keep them in lockstep so the cluster's ate-api
# and our generated client agree. The client decodes Actors by field number, and upstream has
# renumbered fields before without a wire error, so a mismatch corrupts silently rather than failing.
env:
  SUBSTRATE_REF: fc0e3586a6de7cf1b896b948d05df7d5ef8b8870
  KO_DOCKER_REPO: localhost:5001
  E2E_IMAGE: localhost:5001/agentsessions-e2e:${{ github.sha }}
  # ate-setup requires an image credential provider; the kind recipe uses the k8s.io one.
  ATE_CREDENTIAL_PROVIDER: '{"name":"k8s.io"}'
  # ate-setup waits for the api-server before its database has converged on a cold runner, so give
  # the rollouts more than the default budget. `rollout status` returns as soon as a rollout is
  # ready, so this costs nothing on a healthy cluster. An env var rather than a flag because
  # run-microvm-demo-kind.sh does not forward flags to its install step.
  ATE_INSTALL_ROLLOUT_TIMEOUT: 10m

jobs:
  substrate-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agentsessions
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # The adapter module tracks substrate's Go floor, which can be ahead of the root module's.
          go-version-file: integrations/substrate/go.mod

      - name: Setup ko
        uses: ko-build/setup-ko@v0.10

      - name: Clone agent-substrate (pinned)
        run: |
          git clone https://github.com/agent-substrate/substrate _substrate
          git -C _substrate checkout "${SUBSTRATE_REF}"

      - name: Cache micro-VM assets (kata-static + cloud-hypervisor + virtiofsd)
        # Assembling the assets is fully pinned by assemble.sh (all downloads on amd64), so key the
        # cache on its hash. run-microvm-demo-kind.sh skips assembling when these are present.
        uses: actions/cache@v6
        with:
          path: _substrate/bin/microvm-assets/amd64
          key: microvm-assets-amd64-${{ hashFiles('_substrate/hack/microvm-assets/assemble.sh') }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Enable KVM
        # Grant /dev/kvm via the udev rule substrate's CI uses: both tiers run on micro-VMs (kata +
        # cloud-hypervisor), which need it, and create-kind-cluster.sh mounts it into the node.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create kind cluster + install ate-system
        working-directory: _substrate
        run: |
          hack/create-kind-cluster.sh
          hack/install-ate-kind.sh --deploy-ate-system

      - name: Build the harness image (shared by every tier)
        # Every tier runs the same harnessnode image (HARNESS_KIND selects echo vs counter). ko prints
        # the digest-pinned reference, which substrate requires of an ActorTemplate image.
        run: echo "HARNESS_IMAGE=$(ko build ./cmd/harnessnode)" >> "$GITHUB_ENV"

      - name: Deploy the micro-VM sandbox class
        # Before any tier: both run on it. run-microvm-demo-kind stages the (cached) kata assets into
        # the in-cluster object store and installs the cluster-scoped `microvm` SandboxConfig our
        # templates use. It also re-applies ate-system (idempotent) and deploys substrate's own counter
        # demo, whose micro-VM pool is only inert because our WorkerPool labels are repo-scoped: worker
        # eligibility is label-matched cluster-wide with no namespace filter.
        working-directory: _substrate
        run: hack/run-microvm-demo-kind.sh

      - name: Apply the echo micro-VM WorkerPool
        # Resolve substrate's ateom-microvm in its own module once; the counter pool below reuses it.
        run: |
          ATEOM_MV_IMG="$(cd _substrate && ko build ./cmd/ateom-microvm)"
          echo "ATEOM_MV_IMG=${ATEOM_MV_IMG}" >> "$GITHUB_ENV"
          kubectl --context kind-kind apply -f deploy/substrate/namespace.yaml
          sed -e "s#ko://github.com/agent-substrate/substrate/cmd/ateom-microvm#${ATEOM_MV_IMG}#" \
              deploy/substrate/echo-microvm-workerpool.yaml | kubectl --context kind-kind apply -f -
          hack/wait-worker-pool.sh echo-microvm

      - name: Build the conformance test binary image
        # `go test -c` rather than ko: this is a test binary, and ko builds main packages. Static
        # (CGO_ENABLED=0, pure-Go sqlite), pushed to the same local registry kind pulls from.
        run: |
          cd integrations/substrate
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -c -o "${RUNNER_TEMP}/e2e.test" ./e2e
          cp ../../deploy/substrate/Dockerfile.e2e "${RUNNER_TEMP}/Dockerfile"
          docker build -t "${E2E_IMAGE}" "${RUNNER_TEMP}"
          docker push "${E2E_IMAGE}"

      - name: Stateless-tier conformance (in-cluster Job)
        # Runs before the stateful tier, so a break in the cheap tier fails first. The suspend test
        # checkpoints a session under an idle harness stream through the router.
        env:
          ECHO_SANDBOX_CLASS: microvm
        run: hack/run-e2e-job.sh 'TestStatelessReplay|TestSuspendUnderAnIdleHarnessStream' "${E2E_IMAGE}" 900

      - name: Idle harness stream across the router's route timeout (in-cluster Job)
        # A turn parked on a slow model call holds its Connect stream idle. The router bounds streams
        # by --route-timeout (5m default) plus a 30s idle timeout; on kind the idle stream was reset
        # at 5m30s. The gap stays well past that so the outcome is not a race. The step records the
        # router's behavior rather than gating a change, and costs about 6 minutes, so it runs on
        # push, nightly and manual runs only, not on every pull request.
        if: github.event_name != 'pull_request'
        env:
          ECHO_SANDBOX_CLASS: microvm
          E2E_IDLE_GAP: 6m30s
        run: hack/run-e2e-job.sh 'TestHarnessStreamIdlePastRouteTimeout' "${E2E_IMAGE}" 1200

      - name: Apply the counter micro-VM WorkerPool
        run: |
          sed -e "s#ko://github.com/agent-substrate/substrate/cmd/ateom-microvm#${ATEOM_MV_IMG}#" \
              deploy/substrate/counter-microvm-workerpool.yaml | kubectl --context kind-kind apply -f -
          hack/wait-worker-pool.sh counter-microvm

      - name: Stateful-tier + fork conformance (in-cluster Job)
        # Memory continuity across suspend/restore (the differentiator a plain pod cannot do), and
        # fork: fan out k children from one parent checkpoint and require each to continue at N+1
        # independently, the claim that a stateful fork clones RAM instead of silently cold-booting.
        # Then two sessions' calls through the router at once, each of which must reach its own actor.
        env:
          COUNTER_SANDBOX_CLASS: microvm
        run: hack/run-e2e-job.sh 'TestMemorySnapshotSuspendResume|TestFork|TestConcurrentSessionsReachTheirOwnActors' "${E2E_IMAGE}" 1500

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl --context kind-kind get workerpool,jobs,pods -A -o wide || true
          for ns in ate-agentsessions ate-system; do
            for p in $(kubectl --context kind-kind get pods -n "$ns" -o name 2>/dev/null); do
              echo "=== logs: $ns/$p ==="
              kubectl --context kind-kind logs -n "$ns" "$p" --all-containers --tail=200 2>/dev/null || true
            done
          done
