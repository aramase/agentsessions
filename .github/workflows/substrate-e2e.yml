# Real-substrate conformance in kind. Heavy (kind + KVM + ate-system + micro-VM assets) but ~15 min and
# stable, so it gates every PR as well as running nightly. It copies agent-substrate's own
# pr-workflow.yaml recipe (free-disk, /dev/kvm udev rule, kind bring-up). Axis 1 = gVisor + the echo
# harness + ResumeActor{boot:true} + journal replay, driven by an IN-CLUSTER Job: the atenet mesh is
# HTTP/1.1-only to actors (Q1 resolved), so the harness is reached by a direct gRPC dial to the actor's
# PodIP:80 (like google/ax), not the router. Axis 2 = the in-RAM counter (REQUIRES_MEMORY_SNAPSHOT) on a
# micro-VM: drive to N -> suspend (memory snapshot) -> resume -> the count continues (N+1), which no
# journal replay could reconstruct — the differentiator a plain pod cannot do. Both axes run in one
# cluster; axis-2's micro-VM setup reuses substrate's run-microvm-demo-kind recipe (kata +
# cloud-hypervisor asset cache).
name: substrate-e2e

on:
  push:
    branches: [main]
  pull_request:
    # The live cluster e2e is heavy; skip it for changes that cannot affect substrate conformance
    # (docs, the demo UI, and demo media). Any code, deploy, or workflow change still runs it, and
    # push to main plus the nightly schedule always run the full suite.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "cmd/agentui/**"
      - "demos/**"
  schedule:
    - cron: "0 7 * * *" # nightly, so a green main is re-proven against a fresh cluster
  workflow_dispatch: {}

permissions:
  contents: read

# One cluster run per ref: a new push supersedes the in-flight run rather than burning a second
# cluster alongside it. Scheduled and main runs key on their own ref and are a day apart.
concurrency:
  group: substrate-e2e-${{ github.ref }}
  cancel-in-progress: true

# The agent-substrate commit our adapter's go.mod pins; keep them in lockstep so the cluster's
# ateapi and our generated client agree.
env:
  SUBSTRATE_REF: aa1d14a7b33b
  KO_DOCKER_REPO: localhost:5001

jobs:
  substrate-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agentsessions
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # the explicit cache below also covers the pinned substrate clone builds

      - name: Cache Go build and module caches
        # The pinned SUBSTRATE_REF makes the ate-system, ateom, harnessnode, and axis-driver ko builds
        # deterministic, so a warm Go build cache cuts several minutes off the from-source builds. Keyed
        # on the pinned ref plus both modules' go.sum, with prefix restore-keys for a partial warm start.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: substrate-e2e-go-${{ runner.os }}-${{ env.SUBSTRATE_REF }}-${{ hashFiles('go.sum', 'integrations/substrate/go.sum') }}
          restore-keys: |
            substrate-e2e-go-${{ runner.os }}-${{ env.SUBSTRATE_REF }}-
            substrate-e2e-go-${{ runner.os }}-

      - name: Setup ko
        uses: ko-build/setup-ko@v0.7

      - name: Clone agent-substrate (pinned)
        run: |
          git clone https://github.com/agent-substrate/substrate _substrate
          git -C _substrate checkout "${SUBSTRATE_REF}"

      - name: Relax ate-system rollout timeouts
        # install-ate.sh waits on deployment/ate-api-server BEFORE statefulset/valkey-cluster, but the
        # api-server crash-loops until valkey has formed a cluster ("redis: cluster has no nodes"). With
        # the upstream 120s budget, whether the api-server converges in time is down to how fast the
        # runner pulls images, which made the gate flaky. `rollout status` returns as soon as the
        # rollout is ready, so a larger budget costs nothing on a healthy cluster and only buys slack on
        # a cold one. Applied to the pinned clone, so it is deterministic.
        working-directory: _substrate
        run: sed -i 's/--timeout=120s/--timeout=600s/g' hack/install-ate.sh

      - name: Cache micro-VM assets (kata-static + cloud-hypervisor + virtiofsd)
        # Assembling the assets is fully pinned by assemble.sh (all downloads on amd64), so key the
        # cache on its hash. run-microvm-demo-kind.sh skips assembling when these are present.
        uses: actions/cache@v4
        with:
          path: _substrate/bin/microvm-assets/amd64
          key: microvm-assets-amd64-${{ hashFiles('_substrate/hack/microvm-assets/assemble.sh') }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Enable KVM
        # Grant /dev/kvm via the udev rule substrate's CI uses: axis-2's micro-VM (kata + cloud-
        # hypervisor) needs it, and create-kind-cluster.sh mounts it into the node. (gVisor does not.)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create kind cluster + install ate-system
        working-directory: _substrate
        run: |
          hack/create-kind-cluster.sh
          # token auth is the simpler first cut (spike §3e); cert is a later matrix dimension.
          hack/install-ate-kind.sh --deploy-ate-system --ateapi-client-auth=token

      - name: Build the harness image (shared by axis 1 and axis 2)
        # Both axes run the same harnessnode image (HARNESS_KIND selects echo vs counter), so build and
        # push it to the local registry once and reuse the ref, instead of ko-building it per axis.
        run: echo "HARNESS_IMG=$(ko build ./cmd/harnessnode)" >> "$GITHUB_ENV"

      - name: Build + apply the echo harness ActorTemplate + WorkerPool
        # The harness image is built once (above); resolve substrate's ateom-gvisor in its own module,
        # substitute both refs into the manifest, apply.
        run: |
          ATEOM_IMG="$(cd _substrate && ko build ./cmd/ateom-gvisor)"
          sed -e "s#ko://github.com/aramase/agentsessions/cmd/harnessnode#${HARNESS_IMG}#" \
              -e "s#ko://github.com/agent-substrate/substrate/cmd/ateom-gvisor#${ATEOM_IMG}#" \
              deploy/substrate/echo-actortemplate.yaml | kubectl --context kind-kind apply -f -
          kubectl --context kind-kind wait --for=condition=Ready \
            actortemplate/echo-harness -n ate-agentsessions --timeout=600s

      - name: Axis-1 conformance (in-cluster Job — placed exec + byte-identical replay on substrate)
        # The atenet mesh is HTTP/1.1-only to actors, so the harness is reached by a direct gRPC dial to
        # the actor's PodIP:80 — which only routes in-cluster. The driver runs as a Job (like ax): Control
        # via the ate-api-server ClusterIP + a mounted SA token, the actor via its pod IP. Exit 0 = pass.
        run: |
          JOB_IMG="$(cd integrations/substrate && ko build ./cmd/axis1)"
          kubectl --context kind-kind delete job axis1-conformance -n ate-agentsessions --ignore-not-found --wait=true
          sed -e "s#ko://github.com/aramase/agentsessions/integrations/substrate/cmd/axis1#${JOB_IMG}#" \
              deploy/substrate/axis1-job.yaml | kubectl --context kind-kind apply -f -
          echo "Waiting for the axis-1 Job to finish..."
          result=""
          for i in $(seq 1 100); do
            s="$(kubectl --context kind-kind get job axis1-conformance -n ate-agentsessions -o jsonpath='{.status.succeeded}' 2>/dev/null)"
            f="$(kubectl --context kind-kind get job axis1-conformance -n ate-agentsessions -o jsonpath='{.status.failed}' 2>/dev/null)"
            if [ "$s" = "1" ]; then result=succeeded; break; fi
            if [ -n "$f" ] && [ "$f" != "0" ]; then result=failed; break; fi
            sleep 3
          done
          echo "=== axis-1 driver logs ==="
          kubectl --context kind-kind logs -n ate-agentsessions job/axis1-conformance --tail=50 || true
          echo "=== Job result: ${result:-timeout} ==="
          test "$result" = "succeeded"

      - name: Deploy the micro-VM sandbox class (axis 2)
        # run-microvm-demo-kind stages the (cached) kata-assets into rustfs and installs the
        # cluster-scoped micro-VM SandboxConfig our counter-microvm ActorTemplate reuses. It also
        # re-applies ate-system (idempotent) and deploys substrate's own counter demo (harmless).
        working-directory: _substrate
        run: hack/run-microvm-demo-kind.sh --ateapi-client-auth=token

      - name: Build + apply the counter harness micro-VM ActorTemplate + WorkerPool
        # Reuses the harness image built once above (HARNESS_IMG); builds substrate's ateom-microvm.
        run: |
          ATEOM_MV_IMG="$(cd _substrate && ko build ./cmd/ateom-microvm)"
          sed -e "s#ko://github.com/aramase/agentsessions/cmd/harnessnode#${HARNESS_IMG}#" \
              -e "s#ko://github.com/agent-substrate/substrate/cmd/ateom-microvm#${ATEOM_MV_IMG}#" \
              deploy/substrate/counter-microvm-actortemplate.yaml | kubectl --context kind-kind apply -f -
          kubectl --context kind-kind wait --for=condition=Ready \
            actortemplate/counter-microvm -n ate-agentsessions --timeout=600s

      - name: Axis-2 conformance (in-cluster Job — memory continuity across suspend/restore)
        # Drive the in-RAM counter to N, SuspendActor (memory snapshot), ResumeActor{boot:false}, and
        # assert continuity (N+1), no double-application, chain-verify across the boundary, fresh fence.
        # The differentiator a plain pod cannot do.
        run: |
          JOB_IMG="$(cd integrations/substrate && ko build ./cmd/axis2)"
          kubectl --context kind-kind delete job axis2-conformance -n ate-agentsessions --ignore-not-found --wait=true
          sed -e "s#ko://github.com/aramase/agentsessions/integrations/substrate/cmd/axis2#${JOB_IMG}#" \
              deploy/substrate/axis2-job.yaml | kubectl --context kind-kind apply -f -
          echo "Waiting for the axis-2 Job to finish..."
          result=""
          for i in $(seq 1 120); do
            s="$(kubectl --context kind-kind get job axis2-conformance -n ate-agentsessions -o jsonpath='{.status.succeeded}' 2>/dev/null)"
            f="$(kubectl --context kind-kind get job axis2-conformance -n ate-agentsessions -o jsonpath='{.status.failed}' 2>/dev/null)"
            if [ "$s" = "1" ]; then result=succeeded; break; fi
            if [ -n "$f" ] && [ "$f" != "0" ]; then result=failed; break; fi
            sleep 3
          done
          echo "=== axis-2 driver logs ==="
          kubectl --context kind-kind logs -n ate-agentsessions job/axis2-conformance --tail=50 || true
          echo "=== Job result: ${result:-timeout} ==="
          test "$result" = "succeeded"

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl --context kind-kind get actortemplate,workerpool,jobs,pods -A -o wide || true
          for ns in ate-agentsessions ate-system; do
            for p in $(kubectl --context kind-kind get pods -n "$ns" -o name 2>/dev/null); do
              echo "=== logs: $ns/$p ==="
              kubectl --context kind-kind logs -n "$ns" "$p" --all-containers --tail=200 2>/dev/null || true
            done
          done
