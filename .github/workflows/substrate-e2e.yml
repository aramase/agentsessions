# Real-substrate conformance in kind. Heavy (kind + KVM + ate-system + micro-VM assets); it gates
# every PR as well as running nightly. It copies agent-substrate's own pr-workflow.yaml recipe
# (/dev/kvm udev rule, kind bring-up, the envoy-dataplane build cache).
#
# The suite is an ordinary Go test package (integrations/substrate/e2e), compiled with `go test -c`
# and run as an in-cluster Job. It reaches each harness the way a production host does: harnesswire
# over h2c to the atenet-router Service, with the ate-target-actor metadata naming the actor. A new
# capability is a new Test function, not another driver binary, Job manifest, or polling shell.
#
# ActorTemplates are substrate API resources, not Kubernetes objects, so the suite creates its own
# through Control with the harness image built here; the workflow only applies the WorkerPools.
#
# Both tiers run on the micro-VM sandbox class, so the suite exercises the same isolation class in
# both and covers the micro-VM path end to end. The class is staged once (substrate's
# install-microvm-deps.sh) before any tier runs. The suite then runs in passes against one
# cluster so the cheap tier fails first:
#   1. stateless tier: the echo harness + byte-identical replay, and a suspend under an idle stream.
#   2. idle stream: one harness stream held idle past the router's 5m route timeout.
#   3. stateful tier + fork: the in-RAM counter driven to N, suspended to a memory snapshot and
#      continued at N+1, which no journal replay could reconstruct, then forked k ways, with every
#      child required to continue at N+1 independently.
#
# Scheduled and manual runs add a canary entry that runs the same suite against agent-substrate's
# main head instead of SUBSTRATE_REF, to surface upstream drift before a bump. It never runs on a
# pull request, and its failure does not fail the run.
#
# On a pull request the changes job first diffs the merge commit against the base branch with
# hack/ci-path-filter.sh. When only paths the suite does not read changed (docs, markdown, the site,
# the license, CODEOWNERS, the dependabot and copilot configs), substrate-conformance skips every
# step and reports success in seconds; it still runs, because it is a required check. Push to main,
# the nightly schedule and manual runs always run the full suite.
#
# Substrate's binaries are built from source at SUBSTRATE_REF (it publishes no images), so the Go
# build and module caches and the envoy-dataplane image's build cache are kept between runs, and a
# warm run reuses them instead of compiling from scratch.
name: substrate-e2e

on:
  push:
    branches: [main]
  # No paths filter: substrate-conformance is a required check, and a workflow a paths filter skips
  # never reports it, so the pull request could not merge. The changes job below decides instead,
  # and substrate-conformance skips its steps when nothing it checks changed.
  pull_request:
  schedule:
    - cron: "0 7 * * *" # nightly, so a green main is re-proven against a fresh cluster
  workflow_dispatch: {}

permissions:
  contents: read

# One cluster run per ref: a new push supersedes the in-flight run rather than burning a second
# cluster alongside it. Scheduled and main runs key on their own ref and are a day apart.
concurrency:
  group: substrate-e2e-${{ github.ref }}
  cancel-in-progress: true

# The agent-substrate commit our adapter's go.mod pins; keep them in lockstep so the cluster's ate-api
# and our generated client agree. The client decodes Actors by field number, and upstream has
# renumbered fields before without a wire error, so a mismatch corrupts silently rather than failing.
env:
  SUBSTRATE_REF: 96dffb287919da3b198402c07e1fc68b7b61c90d
  KO_DOCKER_REPO: localhost:5001
  E2E_IMAGE: localhost:5001/agentsessions-e2e:${{ github.sha }}
  # ate-setup requires an image credential provider; the kind recipe uses the k8s.io one.
  ATE_CREDENTIAL_PROVIDER: '{"name":"k8s.io"}'

jobs:
  changes:
    # Decides whether this pull request changes anything substrate-conformance checks, from the
    # merge commit's diff against the base branch (hack/ci-path-filter.sh holds the ignore list).
    # Every other event runs the full suite.
    name: substrate-e2e path filter
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.filter.outputs.decision }}
    steps:
      - name: Checkout agentsessions
        if: github.event_name == 'pull_request'
        # A failed checkout must not fail this job: the next step then decides `run`.
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          fetch-depth: 2 # the merge commit and both its parents
          persist-credentials: false

      - name: Decide whether the suite runs
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # This step never fails: any doubt decides `run`, so the jobs below run in full.
          decision=run
          if [[ "${EVENT}" != pull_request ]]; then
            echo "${EVENT}: the full suite runs."
          elif ! git rev-parse --verify --quiet 'HEAD^2' >/dev/null; then
            # A pull_request checkout is the merge commit; its first parent is the base branch head.
            echo "::error::HEAD is not the pull request's merge commit; the full suite runs."
          elif ! hack/ci-path-filter-test.sh; then
            echo "::error::hack/ci-path-filter-test.sh failed; the full suite runs."
          else
            # Decide with the base branch's copy of the filter, so a pull request that edits the
            # filter never decides its own run: the filter's own path is relevant in every profile.
            # The pull request's copy decides only while the base branch has none.
            filter="${RUNNER_TEMP}/ci-path-filter.sh"
            git show 'HEAD^1:hack/ci-path-filter.sh' >"${filter}" 2>/dev/null ||
              filter=hack/ci-path-filter.sh
            echo "Deciding with ${filter}."
            answer="$(bash "${filter}" substrate 'HEAD^1' HEAD)" || answer=error
            if [[ "${answer}" == run || "${answer}" == skip ]]; then
              decision="${answer}"
            else
              echo "::error::the path filter answered '${answer}'; the full suite runs."
            fi
          fi
          echo "decision=${decision}" | tee -a "${GITHUB_OUTPUT}"

  substrate-conformance:
    # The pinned entry keeps the bare job name: it is the required status check. The canary entry
    # (main) exists only on scheduled and manual runs, so it can never gate a pull request, and
    # continue-on-error keeps its failure out of the run's result.
    #
    # The canary is known red until the substrate bump: at main's head (603e0062) ateom-microvm is
    # cmd/ateworker-microvm and the module path is go.ate.dev/substrate, so it fails at "Apply the
    # echo micro-VM WorkerPool" and would next fail building the adapter. Read its result in the
    # job list until then; continue-on-error hides it from the run's status and notifications.
    # TODO(canary): drop continue-on-error once the canary is green after the bump, so new drift
    # turns the nightly run red (it still never runs on a pull request).
    name: ${{ matrix.substrate == 'main' && 'substrate-conformance (substrate main)' || 'substrate-conformance' }}
    needs: changes
    # Runs even when the changes job fails, so this required check fails instead of being
    # skipped: a skipped required check would count as passing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.substrate == 'main' }}
    strategy:
      fail-fast: false
      matrix:
        substrate: >-
          ${{ fromJSON(
            (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
            && '["pinned", "main"]' || '["pinned"]'
          ) }}
    steps:
      - name: Fail when the path filter failed
        # The changes job never fails on its own (any doubt decides `run`). If it still does (a
        # runner fault), its decision is empty: fail substrate-conformance rather than trust it.
        if: ${{ !cancelled() && needs.changes.result != 'success' }}
        env:
          RESULT: ${{ needs.changes.result }}
        run: |
          echo "::error::the path filter job ended '${RESULT}'; rerun the workflow."
          exit 1

      - name: Skip the suite (no substrate-relevant changes)
        # The changes job found only paths the suite does not read, so every step below is skipped
        # and this job reports success; the changes job's log lists each path and its verdict.
        if: needs.changes.outputs.decision == 'skip'
        run: |
          msg="No substrate-relevant path changed: substrate-conformance passes without a cluster."
          echo "${msg}" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Free disk space (in the background)
        # Nothing here uses these toolchains. Deleting them took ~100s in the foreground, so delete
        # them at the lowest priority while the cluster comes up; "Wait for the disk cleanup" below
        # collects the result. Nothing waits on it before then: substrate's own e2e, a superset of
        # this cluster, runs with no cleanup at all, and the df here records the space without it.
        if: needs.changes.outputs.decision != 'skip'
        run: |
          df -h /
          {
            status=0
            sudo nice -n 19 ionice -c 3 \
              rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL ||
              status=$?
            echo "${status}" >"${RUNNER_TEMP}/free-disk.done"
          } >"${RUNNER_TEMP}/free-disk.log" 2>&1 </dev/null &

      - name: Checkout agentsessions
        if: needs.changes.outputs.decision != 'skip'
        uses: actions/checkout@v7

      - name: Setup Go
        if: needs.changes.outputs.decision != 'skip'
        id: setup-go
        uses: actions/setup-go@v7
        with:
          # The adapter module tracks substrate's Go floor, which can be ahead of the root module's.
          go-version-file: integrations/substrate/go.mod
          # The Go caches below cover this module and substrate's; setup-go's own cache keys on
          # the root go.sum only and would restore over the same paths.
          cache: false

      - name: Setup ko
        if: needs.changes.outputs.decision != 'skip'
        uses: ko-build/setup-ko@v0.10

      - name: Clone agent-substrate
        # The pinned commit, or main's head on the canary entry. The commit actually checked out is
        # the step's `commit` output, which the cache key and the canary's adapter build use.
        if: needs.changes.outputs.decision != 'skip'
        id: substrate
        env:
          SUBSTRATE: ${{ matrix.substrate }}
        run: |
          git clone https://github.com/agent-substrate/substrate _substrate
          if [[ "${SUBSTRATE}" != main ]]; then
            git -C _substrate checkout "${SUBSTRATE_REF}"
          fi
          git -C _substrate log -1 --format='agent-substrate %H (%cd)'
          echo "commit=$(git -C _substrate rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore the Go build and module caches
        # ko builds every substrate binary from source, which is most of a cold run. Keyed on the
        # substrate commit and the Go version (what decides substrate's builds) plus our go.sum
        # files; the prefixes fall back to the newest cache for the same commit, then Go version.
        if: needs.changes.outputs.decision != 'skip'
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: substrate-e2e-go-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ steps.substrate.outputs.commit }}-${{ hashFiles('go.sum', 'integrations/substrate/go.sum') }}
          restore-keys: |
            substrate-e2e-go-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ steps.substrate.outputs.commit }}-
            substrate-e2e-go-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-

      - name: Cache micro-VM assets (kata-static + cloud-hypervisor + virtiofsd)
        # Assembling the assets is fully pinned by assemble.sh (all downloads on amd64), so key the
        # cache on its hash. install-microvm-deps.sh skips assembling when these are present.
        if: needs.changes.outputs.decision != 'skip'
        uses: actions/cache@v6
        with:
          path: _substrate/bin/microvm-assets/amd64
          key: microvm-assets-amd64-${{ hashFiles('_substrate/hack/microvm-assets/assemble.sh') }}

      - name: Restore the envoy-dataplane image build cache
        # ate-setup builds the egress gateway's envoy image (a Rust dynamic module) with docker
        # buildx, about two minutes cold. Keyed on the build context, which is all the build reads.
        # Saved right after the install below, so a later failure does not discard a cold build.
        if: needs.changes.outputs.decision != 'skip'
        id: envoy-cache
        uses: actions/cache/restore@v6
        with:
          path: _envoy-dataplane-cache
          key: envoy-dataplane-${{ runner.os }}-${{ hashFiles('_substrate/cmd/dataplane/envoy/**') }}

      - name: Set up a buildx builder for the envoy-dataplane image
        # The default docker driver cannot export a build cache; a docker-container builder can.
        # Host networking and plain HTTP let it push to the kind registry. It is not made the
        # default, so every other docker build here keeps loading into the local image store.
        if: needs.changes.outputs.decision != 'skip'
        run: |
          cat > "${RUNNER_TEMP}/buildkitd.toml" <<'EOF'
          [registry."localhost:5001"]
            http = true
          EOF
          docker buildx create --name envoy-dataplane --driver docker-container \
            --driver-opt network=host --buildkitd-config "${RUNNER_TEMP}/buildkitd.toml" --bootstrap

      - name: Enable KVM
        # Grant /dev/kvm via the udev rule substrate's CI uses: both tiers run on micro-VMs (kata +
        # cloud-hypervisor), which need it, and create-kind-cluster.sh mounts it into the node.
        if: needs.changes.outputs.decision != 'skip'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create kind cluster + install ate-system
        # ate-setup waits for the api-server before its database has converged on a cold runner, so
        # give the rollouts more than the default budget. `rollout status` returns as soon as a
        # rollout is ready, so this costs nothing on a healthy cluster. DOCKER_BUILD_FLAGS is
        # ate-setup's hook for its buildx builds: route the envoy-dataplane build to the builder
        # above, reuse the restored cache, and write one only when the cache missed.
        if: needs.changes.outputs.decision != 'skip'
        working-directory: _substrate
        env:
          DOCKER_BUILD_FLAGS: >-
            --builder=envoy-dataplane
            --cache-from=type=local,src=${{ github.workspace }}/_envoy-dataplane-cache
            ${{ steps.envoy-cache.outputs.cache-hit != 'true' && format('--cache-to=type=local,dest={0}/_envoy-dataplane-cache,mode=min', github.workspace) || '' }}
        run: |
          hack/create-kind-cluster.sh
          hack/install-ate-kind.sh --deploy-ate-system --rollout-timeout 10m

      - name: Save the envoy-dataplane image build cache
        # Only when the restore missed and the build wrote a cache (buildx writes index.json once
        # the export completes), and even if the install failed after the envoy build finished.
        if: >-
          needs.changes.outputs.decision != 'skip'
          && !cancelled()
          && steps.envoy-cache.outputs.cache-hit != 'true'
          && hashFiles('_envoy-dataplane-cache/index.json') != ''
        uses: actions/cache/save@v6
        with:
          path: _envoy-dataplane-cache
          key: ${{ steps.envoy-cache.outputs.cache-primary-key }}

      - name: Wait for the disk cleanup
        if: needs.changes.outputs.decision != 'skip'
        run: |
          done_file="${RUNNER_TEMP}/free-disk.done"
          for _ in $(seq 300); do
            [[ -s "${done_file}" ]] && break
            sleep 2
          done
          cat "${RUNNER_TEMP}/free-disk.log"
          echo "cleanup exit status: $(cat "${done_file}" 2>/dev/null || echo 'still running after 10m')"
          df -h /

      - name: Build the harness image (shared by every tier)
        # Every tier runs the same harnessnode image (HARNESS_KIND selects echo vs counter). ko prints
        # the digest-pinned reference, which substrate requires of an ActorTemplate image.
        if: needs.changes.outputs.decision != 'skip'
        run: echo "HARNESS_IMAGE=$(ko build ./cmd/harnessnode)" >> "$GITHUB_ENV"

      - name: Deploy the micro-VM sandbox class
        # Before any tier: both run on it. install-microvm-deps.sh is the step of substrate's
        # run-microvm-demo-kind.sh that stages the (cached) kata assets into the in-cluster object
        # store and installs the cluster-scoped `microvm` SandboxConfig our templates use. The env
        # mirrors what that wrapper exports, with ARCH naming the cached asset set. The rest of the
        # wrapper (a second ate-system apply and substrate's own counter demo) is not needed here.
        if: needs.changes.outputs.decision != 'skip'
        working-directory: _substrate
        env:
          NO_DEV_ENV: "true"
          ATE_INSTALL_KIND: "true"
          BUCKET_NAME: ate-snapshots
          KUBECTL_CONTEXT: kind-kind
          ARCH: amd64
        run: hack/install-microvm-deps.sh --install

      - name: Apply the echo micro-VM WorkerPool
        # Resolve substrate's ateom-microvm in its own module once; the counter pool below reuses it.
        # Only for the node's platform: substrate's .ko.yaml also lists linux/arm64, which would
        # cross-compile a second, unused image.
        if: needs.changes.outputs.decision != 'skip'
        run: |
          ATEOM_MV_IMG="$(cd _substrate && ko build --platform=linux/amd64 ./cmd/ateom-microvm)"
          echo "ATEOM_MV_IMG=${ATEOM_MV_IMG}" >> "$GITHUB_ENV"
          kubectl --context kind-kind apply -f deploy/substrate/namespace.yaml
          sed -e "s#ko://github.com/agent-substrate/substrate/cmd/ateom-microvm#${ATEOM_MV_IMG}#" \
              deploy/substrate/echo-microvm-workerpool.yaml | kubectl --context kind-kind apply -f -
          hack/wait-worker-pool.sh echo-microvm

      - name: Build the adapter against substrate main (canary only)
        # The lockstep rule above applies to the canary too: the cluster runs main's head, so the
        # suite's client must come from the same commit. This edits the runner's checkout only.
        if: needs.changes.outputs.decision != 'skip' && matrix.substrate == 'main'
        working-directory: integrations/substrate
        env:
          SUBSTRATE_COMMIT: ${{ steps.substrate.outputs.commit }}
        run: |
          go get "github.com/agent-substrate/substrate@${SUBSTRATE_COMMIT}"
          go mod tidy

      - name: Build the conformance test binary image
        # `go test -c` rather than ko: this is a test binary, and ko builds main packages. Static
        # (CGO_ENABLED=0, pure-Go sqlite), pushed to the same local registry kind pulls from.
        if: needs.changes.outputs.decision != 'skip'
        run: |
          cd integrations/substrate
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -c -o "${RUNNER_TEMP}/e2e.test" ./e2e
          cp ../../deploy/substrate/Dockerfile.e2e "${RUNNER_TEMP}/Dockerfile"
          docker build -t "${E2E_IMAGE}" "${RUNNER_TEMP}"
          docker push "${E2E_IMAGE}"

      - name: Save the Go build and module caches
        # After the last build, so a test failure below still keeps them. Pinned entry only, and
        # only when the exact key missed: the canary resolves a new commit every night, and saving
        # each one would evict the cache pull requests restore.
        if: >-
          needs.changes.outputs.decision != 'skip'
          && matrix.substrate == 'pinned'
          && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      - name: Stateless-tier conformance (in-cluster Job)
        # Runs before the stateful tier, so a break in the cheap tier fails first. The idle-stream
        # suspend test holds a turn's harness stream open through the router: Suspend must refuse the
        # session while the turn runs and succeed promptly once it returns.
        if: needs.changes.outputs.decision != 'skip'
        env:
          ECHO_SANDBOX_CLASS: microvm
        run: hack/run-e2e-job.sh '^(TestStatelessReplay|TestSessionSuspendResume|TestSuspendUnderAnIdleHarnessStream|TestSessionDeletePending)$' "${E2E_IMAGE}" 1200

      - name: Idle harness stream across the router's route timeout (in-cluster Job)
        # A turn parked on a slow model call holds its Connect stream idle. The router bounds streams
        # by --route-timeout (5m default) plus a 30s idle timeout; on kind the idle stream was reset
        # at 5m30s. The gap stays well past that so the outcome is not a race. The step records the
        # router's behavior rather than gating a change, and costs about 6 minutes, so it runs on
        # push, nightly and manual runs only, not on every pull request.
        if: needs.changes.outputs.decision != 'skip' && github.event_name != 'pull_request'
        env:
          ECHO_SANDBOX_CLASS: microvm
          E2E_IDLE_GAP: 6m30s
        run: hack/run-e2e-job.sh 'TestHarnessStreamIdlePastRouteTimeout' "${E2E_IMAGE}" 1200

      - name: Apply the counter micro-VM WorkerPool
        if: needs.changes.outputs.decision != 'skip'
        run: |
          sed -e "s#ko://github.com/agent-substrate/substrate/cmd/ateom-microvm#${ATEOM_MV_IMG}#" \
              deploy/substrate/counter-microvm-workerpool.yaml | kubectl --context kind-kind apply -f -
          hack/wait-worker-pool.sh counter-microvm

      - name: Stateful-tier + fork conformance (in-cluster Job)
        # Memory continuity across suspend/restore (the differentiator a plain pod cannot do), and
        # fork: fan out k children from one parent checkpoint and require each to continue at N+1
        # independently, the claim that a stateful fork clones RAM instead of silently cold-booting.
        # A stateful session whose actor was deleted must be refused, not cold-created.
        # Then two sessions' calls through the router at once, each of which must reach its own actor.
        if: needs.changes.outputs.decision != 'skip'
        env:
          COUNTER_SANDBOX_CLASS: microvm
        run: hack/run-e2e-job.sh 'TestMemorySnapshotSuspendResume|TestMemorySessionWhoseActorIsLostIsRefused|TestFork|TestConcurrentSessionsReachTheirOwnActors|TestSessionDeletePendingOnMicroVM' "${E2E_IMAGE}" 2400

      - name: Dump diagnostics on failure
        if: needs.changes.outputs.decision != 'skip' && failure()
        run: |
          df -h / || true
          kubectl --context kind-kind get workerpool,jobs,pods -A -o wide || true
          for ns in ate-agentsessions ate-system; do
            for p in $(kubectl --context kind-kind get pods -n "$ns" -o name 2>/dev/null); do
              echo "=== logs: $ns/$p ==="
              kubectl --context kind-kind logs -n "$ns" "$p" --all-containers --tail=200 2>/dev/null || true
            done
          done
