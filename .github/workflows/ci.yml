name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Reproducibility gate: regenerating from the .proto must not change the checked-in
      # generated code. `git add -N` marks any newly-generated-but-untracked file as
      # intent-to-add so it shows up in `git diff` (otherwise untracked files pass trivially).
      - name: codegen is reproducible
        run: |
          buf generate
          git add -N api/genpb
          git diff --exit-code -- api/genpb

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
