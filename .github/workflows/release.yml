name: release

# Releases are cut by pushing a tag. The tag is the trigger rather than a manual dispatch so the
# artifacts and the git history can never disagree about what was released.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The full suite runs again against the tagged commit. CI already ran it on the pull request, but
  # a tag can point at any commit, and publishing something that was never verified at that exact
  # revision is the failure this prevents.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: codegen is reproducible
        run: |
          buf generate
          git add -N api/genpb
          git diff --exit-code -- api/genpb

      - name: api reference is current
        run: |
          ./hack/gen-api-reference.sh
          git add -N docs/api-reference.md
          git diff --exit-code -- docs/api-reference.md

      - run: buf lint

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

      - name: core links no backend vendor
        run: test "$(go list -deps ./... | grep -c agent-substrate)" = "0"

      - name: integrity golden self-check
        run: python3 hack/verify_chain.py --golden

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload artifacts
      packages: write # push container images to ghcr.io
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser builds the changelog from the commit range since the previous tag, so it
          # needs the full history rather than a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Generates the per-archive SBOMs the goreleaser config asks for.
      - uses: anchore/sbom-action/download-syft@v0

      # ko builds the images straight from the Go packages and pushes them, so the release publishes
      # binaries and images from one run rather than leaving a deployment to build its own.
      #
      # Installed directly rather than through ko-build/setup-ko, because that action always exports
      # KO_DOCKER_REPO and the variable takes precedence over the per-image repositories in
      # .goreleaser.yaml. With it set, ko appended an MD5 hash to the derived name (v0.1.1) or, with
      # bare, collapsed both images onto the one repo (v0.1.2). goreleaser only needs the binary on
      # PATH; docker/login-action below supplies the registry credential.
      - name: install ko
        run: go install github.com/google/ko@latest

      - name: log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      # Provenance ties each artifact to this workflow, this commit, and this runner, so a consumer
      # can verify where a binary came from instead of trusting the release page.
      #
      # The attestation API rejects user-owned private repositories, and a release that already
      # published its artifacts should not then fail on a step that cannot succeed. Skipping while
      # private keeps the run honest, and the condition arms itself the moment the repository is
      # public rather than needing to be remembered.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      # Images carry a ko-generated SBOM pushed alongside them. Provenance for them needs one
      # attestation per image digest, which cannot be exercised while the repository is private, so
      # it is deliberately not written blind: it lands with the first public release.
      - if: ${{ github.event.repository.private }}
        run: |
          echo "Repository is private: build provenance is unavailable until it is public."
