// The Sessions control-plane API (client-facing) and the Runtime compute types.
//
// A Session is a durable conversation (event log) plus zero-or-one live incarnation.
// Each Exec is one execution/turn. Fork branches the log at a sequence.
syntax = "proto3";

package agentsessions.v1;

option go_package = "github.com/aramase/agentsessions/api/genpb;agentsessionsv1";

import "common.proto";

// ExecState is the execution/turn axis; ComputeState is the incarnation axis. The two are
// modeled explicitly (§6 of the replay contract) and reported independently: there is no
// flattened lifecycle enum, because collapsing them loses which axis actually moved.
enum ExecState {
  EXEC_STATE_UNSPECIFIED = 0;
  EXEC_PENDING = 1;
  EXEC_RUNNING = 2;
  EXEC_AWAITING = 3; // blocked on approval/input, resolved from the log
  EXEC_COMPLETED = 4;
  EXEC_FAILED = 5;
  EXEC_CANCELED = 6;
}

enum ComputeState {
  COMPUTE_STATE_UNSPECIFIED = 0;
  COMPUTE_NONE = 1; // no incarnation
  COMPUTE_LIVE = 2;
  COMPUTE_WARM = 3; // paused: resident, worker held
  COMPUTE_COLD = 4; // suspended: snapshot in storage, worker freed
  COMPUTE_TERMINATED = 5;
}

// SnapshotRef is the session-STATUS ref carried in ComputeRef below. Its shape mirrors the canonical
// Go SPI type api.SnapshotRef and the durable form the log carries inline on the SUSPEND Lifecycle
// event (common.proto Lifecycle.snapshot_*), so the three agree field for field.
//
// local and external_uri are deliberately NOT a oneof: a memory-capable backend sets both at once
// (substrate reports an actor handle in local and the object-storage URI in external_uri), which a
// oneof cannot express. A filesystem-only backend sets only local, with memory=false.
//
// ComputeRef is not yet populated on the wire; the Placer records the ref on the SUSPEND event
// instead. Wiring session status is tracked separately.
message SnapshotRef {
  string local = 1;
  string external_uri = 2;
  bool memory = 3; // RAM/process captured? pod: false, kata/clh: true
  bool sealed = 4; // encrypted + attested (confidential)
}

message RuntimeCapabilities {
  bool memory_snapshot = 1;
  bool cow_fork = 2;
  bool attest = 3;
  bool gpu_state = 4;
}

message ComputeRef {
  string runtime = 1; // "pod" | "kata" | "clh" | "substrate"
  string worker = 2;  // pod/worker id when live/warm; empty when cold
  SnapshotRef snapshot = 3;
  RuntimeCapabilities capabilities = 4;
  map<string, string> attributes = 5; // backend-specific, e.g. substrate actor/atespace
  int64 fence_token = 6;              // monotonic; log rejects appends from a superseded incarnation
}

message Session {
  ResourceMetadata metadata = 1;
  string harness = 2;
  string model = 3; // model-agnostic id

  reserved 4; // retired: a flattened lifecycle phase, replaced by the two axes below
  ExecState exec_state = 13;       // execution/turn axis
  ComputeState compute_state = 14; // incarnation axis
  int64 last_seq = 5;              // event-log cursor

  string parent_uid = 6; // fork lineage
  int64 fork_seq = 7;

  IdentityRef identity = 8;
  ComputeRef compute = 9; // empty when SUSPENDED/TERMINATED
  Origin origin = 10;     // neutral external context; filled by a producer adapter

  map<string, string> labels = 11;
  map<string, string> annotations = 12; // free-form adapter metadata (K8s-style)
}

message CreateSessionRequest { Session session = 1; }
message GetSessionRequest { string uid = 1; }

// ListSessions enumerates sessions from the durable store, so it returns sessions that have no
// events and no live incarnation yet. Paging is keyset over (create_time DESC, uid ASC), which is
// stable when a session is created mid-pagination; an offset would skip or repeat rows.
message ListSessionsRequest {
  string project = 1; // tenant / namespace; exact-match filter, not a prefix or wildcard
  // Maximum sessions to return. 0 = the server default; a value above the server maximum is
  // clamped rather than rejected.
  int32 page_size = 2;
  // Opaque cursor taken verbatim from a prior ListSessionsResponse.next_page_token. Empty = first
  // page. A token the server cannot parse is INVALID_ARGUMENT, never a silent restart from page 1.
  string page_token = 3;
}
message ListSessionsResponse {
  repeated Session sessions = 1;
  string next_page_token = 2; // empty on the last page
}
message DeleteSessionRequest { string uid = 1; }

message ExecRequest {
  string session = 1;
  // Input messages for this turn. Empty = resume/re-drive the last non-terminal
  // execution with no new input (recovery after a crash/interruption).
  repeated Message inputs = 2;
  int64 resume_from_seq = 3; // client replay cursor after a disconnect (was: last_seq)
  string harness = 4;        // empty = session default
  bytes config = 5;
  // Single-writer CAS: the host commits this execution's first event only if the log
  // head equals expected_last_seq. Mismatch is rejected (another writer advanced the log).
  int64 expected_last_seq = 6;
  int64 deadline_unix = 7;   // optional execution deadline (unix seconds); host cancels past it
}

message ReplayRequest {
  string session = 1;
  int64 from_seq = 2;
  int64 to_seq = 3; // 0 = to head
}

message SuspendRequest { string session = 1; }

message ResumeRequest {
  string session = 1;
  bool boot = 2; // true = cold-boot + replay instead of snapshot restore
}

message ForkRequest {
  string session = 1;
  // 0 = HEAD. A REQUIRES_MEMORY_SNAPSHOT harness forks by cloning a memory snapshot, which captures
  // RAM as of now, so it accepts only HEAD; a historical seq is FAILED_PRECONDITION.
  int64 at_seq = 2;
  int32 count = 3;          // fan-out N children; must be 1..128, else INVALID_ARGUMENT
  IdentityRef identity = 4; // optional child principal
  map<string, string> labels = 5;
  // Display names for the children, in the order they are returned. Length must be 0 or exactly
  // count, else INVALID_ARGUMENT.
  //
  // Left unset, a child's name is empty rather than a copy of the parent's. A fork inherits the
  // parent's workload (project, harness, model) because that is what defines the run, but a name is
  // a caller-supplied label the server has no basis to invent. Copying it makes a listing report N+1
  // rows that claim to be the same session, and synthesizing one ("<parent> fork 2") would put a
  // presentation convention in the wire contract and be wrong the moment the same parent is forked
  // by two separate calls. Lineage is already on the child as parent_uid and fork_seq, so a caller
  // that wants a derived label can render one without the server denormalizing it into a string.
  repeated string child_names = 6;
}
message ForkResponse { repeated Session children = 1; }

message CancelRequest {
  string session = 1;
  string execution_id = 2;
  string reason = 3; // USER | TIMEOUT | INTERNAL
}

// ExecUpdate is what the live Exec stream carries: a committed LogRecord, or an ephemeral
// streaming Delta (transport only — not logged, not hash-chained).
message ExecUpdate {
  oneof update {
    LogRecord record = 1;
    Delta delta = 2;
  }
}

// Delta is an ephemeral streaming chunk that coalesces into a finalized EVENT_OUTPUT (or
// reasoning) part. No seq; never hash-chained (§8, A2A TaskArtifactUpdateEvent).
message Delta {
  string execution_id = 1;
  int32 part_index = 2; // which content part it accumulates into
  string chunk = 3;     // text chunk; binary/media deltas are a later addition
  bool done = 4;        // last delta for this part
}

service Sessions {
  rpc CreateSession(CreateSessionRequest) returns (Session);
  rpc GetSession(GetSessionRequest) returns (Session);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc DeleteSession(DeleteSessionRequest) returns (Session);

  // Exec runs one execution/turn. The live stream carries committed LogRecords plus
  // ephemeral Deltas; Replay re-delivers committed records only (read-only).
  rpc Exec(ExecRequest) returns (stream ExecUpdate);
  rpc Replay(ReplayRequest) returns (stream LogRecord);

  // In-flight control.
  rpc Cancel(CancelRequest) returns (Session); // cancel the in-flight execution

  // Compute-layer durability. There is no warm Pause: no Runtime backend implements a
  // node-local warm checkpoint, so a session goes straight from live to a cold snapshot.
  rpc Suspend(SuspendRequest) returns (Session); // cold, free worker
  rpc Resume(ResumeRequest) returns (Session);

  // The differentiator: branch a session at a sequence into one or more children. Forking a
  // REQUIRES_MEMORY_SNAPSHOT harness first checkpoints the parent (it suspends, and a SUSPEND event
  // lands on its chain) because the children are cloned from that snapshot; resume brings it back.
  rpc Fork(ForkRequest) returns (ForkResponse);
}
