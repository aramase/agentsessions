// The Sessions control-plane API (client-facing) and the Runtime compute types.
//
// A Session is a durable conversation (event log) plus zero-or-one live incarnation.
// Each Exec is one execution/turn. Fork branches the log at a sequence.
syntax = "proto3";

package agentsessions.v1;

option go_package = "github.com/agent-primitives/sessions/api/genpb;agentsessionsv1";

import "common.proto";
import "google/protobuf/timestamp.proto";

// ExecState is the execution/turn axis; ComputeState is the incarnation axis. The two are
// modeled explicitly (§6 of the replay contract) and reported independently: there is no
// flattened lifecycle enum, because collapsing them loses which axis actually moved.
enum ExecState {
  EXEC_STATE_UNSPECIFIED = 0;
  EXEC_PENDING = 1;
  EXEC_RUNNING = 2;
  EXEC_AWAITING = 3; // blocked on approval/input, resolved from the log
  EXEC_COMPLETED = 4;
  EXEC_FAILED = 5;
  EXEC_CANCELED = 6;
}

enum ComputeState {
  COMPUTE_STATE_UNSPECIFIED = 0;
  COMPUTE_NONE = 1; // no incarnation
  COMPUTE_LIVE = 2;
  COMPUTE_WARM = 3; // paused: resident, worker held
  COMPUTE_COLD = 4; // suspended: snapshot in storage, worker freed
  COMPUTE_TERMINATED = 5;
}

// DeletionState is independent of the execution and compute axes. PENDING is a permanent
// UID tombstone and durable deletion intent, not confirmation that resources were reclaimed.
// Until ownership and cleanup are implemented (#88), deletion emits PENDING only: actors,
// fork-child pins and snapshots remain retained, and no Runtime.Stop is attempted.
enum DeletionState {
  DELETION_STATE_UNSPECIFIED = 0;
  DELETION_ACTIVE = 1;
  DELETION_PENDING = 2;
}

// SnapshotRef is the session-STATUS ref carried in ComputeRef below. Its shape mirrors the canonical
// Go SPI type api.SnapshotRef and the durable form the log carries inline on the SUSPEND Lifecycle
// event (common.proto Lifecycle.snapshot_*), so the three agree field for field.
//
// local and external_uri are deliberately NOT a oneof: a memory-capable backend sets both at once
// (substrate reports an actor handle in local and the object-storage URI in external_uri), which a
// oneof cannot express. A filesystem-only backend sets only local, with memory=false.
//
// ComputeRef is not yet populated on the wire; the Placer records the ref on the SUSPEND event
// instead. Wiring session status is tracked separately.
message SnapshotRef {
  string local = 1;
  string external_uri = 2;
  bool memory = 3; // RAM/process captured? pod: false, kata/clh: true
  bool sealed = 4; // encrypted + attested (confidential)
}

message RuntimeCapabilities {
  bool memory_snapshot = 1;
  bool cow_fork = 2;
  bool attest = 3;
  bool gpu_state = 4;
}

message ComputeRef {
  string runtime = 1; // "pod" | "kata" | "clh" | "substrate"
  string worker = 2;  // pod/worker id when live/warm; empty when cold
  SnapshotRef snapshot = 3;
  RuntimeCapabilities capabilities = 4;
  map<string, string> attributes = 5; // backend-specific, e.g. substrate actor/atespace
  int64 fence_token = 6;              // monotonic; log rejects appends from a superseded incarnation
}

message Session {
  ResourceMetadata metadata = 1;
  string harness = 2;
  string model = 3; // model-agnostic id

  reserved 4; // retired: a flattened lifecycle phase, replaced by the two axes below
  // Every Session reply uses the same append-transaction projection at last_seq: no events
  // before deletion reports EXEC_PENDING; a valid owned unanswered host approval request in the
  // latest first-seen execution reports EXEC_AWAITING; other histories retain EXEC_COMPLETED.
  // DELETE preserves this execution axis but withholds actionable pending_approval.
  // COMPLETED is a compatibility fallback, not proof of END, a receipt, or admission.
  ExecState exec_state = 13;
  ComputeState compute_state = 14; // incarnation axis
  // Set for a valid unanswered host-owned APPROVAL_REQUEST in the latest first-seen execution
  // at last_seq on an ACTIVE session. Requests/decisions match execution_id, tool_call_id and
  // request_seq. Calls whose TOOL_CALL precedes the child's latest FORK are excluded. Unset when
  // deleted, no request is reportable, approval-bearing evidence is invalid, or the projection
  // lags last_seq.
  ApprovalRef pending_approval = 15;
  DeletionState deletion_state = 16; // independent permanent-deletion axis
  // Absent for ACTIVE; set once when the host commits the durable PENDING tombstone.
  google.protobuf.Timestamp deletion_requested_time = 17;
  int64 last_seq = 5;              // event-log cursor

  string parent_uid = 6; // fork lineage
  int64 fork_seq = 7;

  // Recorded provenance, never enforced: it says on whose behalf a session was created, and the
  // hash chain makes that record tamper-evident. Nothing in this implementation treats it as
  // authorization. See docs/security.md.
  IdentityRef identity = 8;
  ComputeRef compute = 9; // empty when SUSPENDED/TERMINATED
  Origin origin = 10;     // neutral external context; filled by a producer adapter

  map<string, string> labels = 11;
  map<string, string> annotations = 12; // free-form adapter metadata (K8s-style)
}

message CreateSessionRequest { Session session = 1; }
message GetSessionRequest { string uid = 1; }

// ListSessions enumerates ACTIVE sessions from the durable store, including sessions that have
// no events and no live incarnation yet. Permanently tombstoned UIDs are hidden before pagination.
// Paging is keyset over (create_time DESC, uid ASC), which is
// stable when a session is created mid-pagination; an offset would skip or repeat rows.
message ListSessionsRequest {
  string project = 1; // tenant / namespace; exact-match filter, not a prefix or wildcard
  // Maximum sessions to return. 0 = the server default; a value above the server maximum is
  // clamped rather than rejected.
  int32 page_size = 2;
  // Opaque cursor taken verbatim from a prior ListSessionsResponse.next_page_token. Empty = first
  // page. A token the server cannot parse is INVALID_ARGUMENT, never a silent restart from page 1.
  string page_token = 3;
}
message ListSessionsResponse {
  repeated Session sessions = 1;
  string next_page_token = 2; // empty on the last page
}
message DeleteSessionRequest { string uid = 1; }

message ExecRequest {
  // The session to run against. Empty creates one first, using the server defaults and the harness
  // below, and returns it as the stream's first frame. A caller that wants to set a project, name,
  // or model still calls CreateSession; this exists so the common case is one call rather than
  // three (create, read the cursor, exec).
  string session = 1;
  // Input messages for a new turn. While this session owns an unreceipted approval call,
  // new inputs are FAILED_PRECONDITION, including after a decision but before its receipt.
  // For an existing current approval-bearing, non-terminal execution, empty inputs recover
  // that recorded invocation via Resume, without a new EXECUTION_START. Recorded inputs,
  // config, harness, version and resume cursor win over this request's invocation overrides.
  // Pending requests return a paused Session without runtime IO; a call-only crash cut repairs
  // the request first. expected_last_seq is checked under the session guard before runtime IO
  // or repair, and deadline_unix bounds recovery. Other inputless Exec calls retain their
  // ordinary new-turn behavior; use Resume for general interrupted-turn recovery.
  repeated Message inputs = 2;
  // Cursor handed to the harness as Start.resume_from_seq. The host does not interpret it; only a
  // harness knows what resuming from a sequence means for its own state. To re-read committed
  // records after a disconnect, use Replay, which is the read path for exactly that. Non-zero cursors
  // are journaled in EXECUTION_START and restored during controller replay/interrupted resume.
  int64 resume_from_seq = 3;
  // Empty = the session's harness. A different harness runs this turn only, unless either one is
  // a registered harness (see HarnessRegistry): then the session is pinned and the call is
  // FAILED_PRECONDITION. If either harness is REQUIRES_MEMORY_SNAPSHOT (and the two are not
  // aliases of one entry), the call is FAILED_PRECONDITION too, before any compute is provisioned,
  // fence minted or journal written: Suspend and Fork follow the session's harness, so they would
  // not checkpoint or clone a memory-tier override's RAM, and parking only an override cannot
  // checkpoint a memory-tier stored harness's live memory.
  string harness = 4;
  // Opaque per-execution config, passed through to Start.config. Non-empty bytes are journaled
  // verbatim in EXECUTION_START before the harness runs, and restored for controller replay/resume.
  // Do not put credentials here: config is durable journal content exposed by Replay.
  bytes config = 5;
  // Single-writer CAS: the host commits this execution's first event only if the log head equals
  // expected_last_seq. A mismatch is ABORTED, meaning another writer advanced the log.
  // A deleted session returns FAILED_PRECONDITION regardless of this cursor's value.
  //
  // It is optional because the guarantee should be opt-in rather than the price of a simple call.
  // Unset means "append at whatever the head is now", which is what a caller with a single writer
  // wants. Set means the strict check, and 0 is a real value there: it asserts the session has no
  // events yet. That distinction is why this carries explicit presence instead of treating 0 as
  // "unset" -- a caller could not otherwise say "this must be the first turn".
  optional int64 expected_last_seq = 6;
  int64 deadline_unix = 7;   // optional execution deadline (unix seconds); host cancels past it
}

message ReplayRequest {
  string session = 1;
  int64 from_seq = 2;
  int64 to_seq = 3; // 0 = to head
}

// Approve supplies an explicit decision for one unresolved request in a stateless execution.
// All tuple fields are required and request_seq must be positive. A decision resolves only a
// request owned by this session, not an inherited parent request. Identity is recorded on the
// decision's Event.actor as provenance, never checked as authorization. No policy hook, expiry,
// automatic decision, or Cancel semantics are implied by this API.
message ApproveRequest {
  string session = 1;
  string execution_id = 2;
  string tool_call_id = 3;
  int64 request_seq = 4;
  // Required presence: false means deny; absent is INVALID_ARGUMENT. Unlike this request, the
  // journal's ApprovalResult.approved remains a non-optional bool for compatibility.
  optional bool approved = 5;
  string reason = 6;
  IdentityRef identity = 7;
}

// A successful Approve commits the decision only, never resumes compute or executes a tool.
// The caller invokes Resume separately. decision is the committed APPROVAL_RESULT LogRecord;
// an exact retry returns that same record, not a new decision or receipt.
message ApproveResponse {
  Session session = 1;
  LogRecord decision = 2;
}

message SuspendRequest { string session = 1; }

message ResumeRequest {
  string session = 1;
  // Ignored. The service never reads it; the Runtime backend decides how a resumed session comes
  // back. On substrate that is the actor's own snapshot, else the template's golden snapshot, else a
  // cold boot, and substrate has no per-resume boot flag to forward it to. The field stays so
  // existing clients keep encoding; do not reuse its number.
  bool boot = 2 [deprecated = true];
  // Optional recovery precondition: ABORTED with expected/head values on a mismatch.
  // A deleted session returns FAILED_PRECONDITION regardless of this cursor's value.
  // Checked under the session guard before inspection, after an early fence before restore
  // or approval repair, and after a restored turn's regular writer fence before Run. A late
  // mismatch may already have restored compute, but does not run the harness or append records.
  // These checks catch other hosts' writes committed before each acquired fence. Taking a fence
  // supersedes older writers even on refusal: their remaining writes fail with ErrFenced, leaving any
  // unanswered tool intent eligible for retry on a later Resume. Fencing cannot cancel effects
  // already in flight, and a later writer can still supersede this operation: this is not an
  // execution lease or exactly-once tool guarantee. Explicit zero requires an empty journal;
  // absent skips this precondition.
  optional int64 expected_last_seq = 3;
}

// Children inherit the parent's annotations and origin.
message ForkRequest {
  string session = 1;
  // 0 = HEAD. A REQUIRES_MEMORY_SNAPSHOT harness forks by cloning a memory snapshot, which captures
  // RAM as of now, so it accepts only HEAD; a historical seq is FAILED_PRECONDITION.
  int64 at_seq = 2;
  int32 count = 3;          // fan-out N children; must be 1..128, else INVALID_ARGUMENT
  // Unsupported: per-child principals are not enforced. Any supplied identity, including an empty
  // message, is INVALID_ARGUMENT before placement or mutation. Leave unset to fork.
  IdentityRef identity = 4;
  // Applied to every child instead of the parent's labels; never merged or inherited. Unset or
  // empty gives children an empty label map. The parent's annotations are inherited unchanged.
  map<string, string> labels = 5;
  // Display names for the children, in the order they are returned. Length must be 0 or exactly
  // count, else INVALID_ARGUMENT.
  //
  // Left unset, a child's name is empty rather than a copy of the parent's. A fork inherits the
  // parent's workload (project, harness, model) because that is what defines the run, but a name is
  // a caller-supplied label the server has no basis to invent. Copying it makes a listing report N+1
  // rows that claim to be the same session, and synthesizing one ("<parent> fork 2") would put a
  // presentation convention in the wire contract and be wrong the moment the same parent is forked
  // by two separate calls. Lineage is already on the child as parent_uid and fork_seq, so a caller
  // that wants a derived label can render one without the server denormalizing it into a string.
  repeated string child_names = 6;
}
message ForkResponse { repeated Session children = 1; }

message CancelRequest {
  string session = 1;
  string execution_id = 2;
  string reason = 3; // USER | TIMEOUT | INTERNAL
}

// ExecUpdate is what the live Exec stream carries: the session, a committed LogRecord, or an
// ephemeral streaming Delta (transport only — not logged, not hash-chained).
message ExecUpdate {
  oneof update {
    LogRecord record = 1;
    Delta delta = 2;
    // The session this execution runs against, sent as the FIRST frame of every Exec stream. It is
    // how a caller learns the uid of a session Exec created for it, and it reports the cursor
    // the turn started from. A successful approval park or approval-bearing no-input recovery
    // also sends a FINAL current Session before OK stream closure. That frame carries the latest
    // cursor and pending approval, when present; use the latest Session and committed record
    // cursors for the next CAS, not the initial frame alone. A pause is not a terminal END/ERROR,
    // and a pending query alone is not proof that compute has been made cold.
    //
    // It is sent before the turn runs, so a failed execution still tells the caller which session
    // it was against. A caller therefore sees this frame BEFORE any error, and must read the
    // stream to completion rather than treating the first receive as the result.
    Session session = 3;
  }
}

// Delta is an ephemeral streaming chunk that coalesces into a finalized EVENT_OUTPUT (or
// reasoning) part. No seq; never hash-chained (§8, A2A TaskArtifactUpdateEvent).
message Delta {
  string execution_id = 1;
  int32 part_index = 2; // which content part it accumulates into
  string chunk = 3;     // text chunk; binary/media deltas are a later addition
  bool done = 4;        // last delta for this part
}

service Sessions {
  rpc CreateSession(CreateSessionRequest) returns (Session);
  // GetSession remains available for audit after deletion, including metadata and deletion intent
  // time.
  rpc GetSession(GetSessionRequest) returns (Session);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // DeleteSession commits irreversible soft-deletion intent for a known UID. The host atomically
  // appends a session-scoped, host-owned LIFECYCLE_DELETE (empty execution_id), advances the writer
  // fence and marks PENDING. Metadata, the UID and the hash-chained journal are retained forever;
  // the UID cannot be reused. Children and their copied prefixes are unaffected: no cascade or
  // data erasure is promised. ListSessions hides the UID; GetSession and raw Sessions.Replay remain
  // read-only audit access, without reconstructing or running a harness.
  //
  // Valid mutation requests against PENDING fail with FAILED_PRECONDITION before routing,
  // recovery or compute effects: Exec, Fork (including historical at_seq), Resume, Suspend and
  // Approve are refused, including exact historical decision retries. Pending approval metadata
  // grants no permission.
  //
  // Until ownership and cleanup land (#88), OK + PENDING acknowledges durable intent only. No
  // Runtime.Stop, actor/pin release, physical snapshot GC or TERMINATED transition is attempted
  // or promised. Execution and compute reporting stay independent. The retained journal
  // is audit evidence, not a complete or authoritative cleanup-target inventory; the allocation
  // ownership and cleanup-target schema belong to #88, not an inferred default harness or owner.
  // Repeated PENDING deletion returns the identical Session: no timestamp, update_time, journal,
  // fence or compute-projection changes. Clients must inspect deletion_state, not infer reclamation
  // from an OK status.
  //
  // Empty uid is INVALID_ARGUMENT; an unknown nonempty uid is NOT_FOUND without creating a row.
  // Overlap with a mutation in the same Registry/host is ABORTED before mutation, without canceling
  // the holder; retry after it finishes. Storage faults are INTERNAL, cancellation/deadline retain
  // CANCELLED/DEADLINE_EXCEEDED. An error or lost reply after intent commits cannot undo the hidden
  // PENDING tombstone or erase its audit evidence: use GetSession or retry to learn the outcome.
  //
  // Admission serialization is local to one Registry/host. Durable fences block subsequent writes
  // from this build's writers; already-open older binaries do not enforce tombstones. A separate
  // host can provision compute before its first fence; cross-host exclusion of compute effects is
  // not guaranteed. Operators still need runtime-side resource reconciliation.
  rpc DeleteSession(DeleteSessionRequest) returns (Session);

  // Exec runs one execution/turn. The live stream carries committed LogRecords plus
  // ephemeral Deltas; Replay re-delivers committed records only (read-only).
  rpc Exec(ExecRequest) returns (stream ExecUpdate);
  // Raw read-only audit: remains available for tombstoned UIDs, including LIFECYCLE_DELETE records.
  // Unlike controller replay, this does not reconstruct or run the harness.
  rpc Replay(ReplayRequest) returns (stream LogRecord);

  // Implemented durable approval decisions for STATELESS_REPLAY executions.
  // OK commits only a decision; the caller must Resume to continue. An exact retry of the tuple,
  // approved value, reason and identity returns the existing decision, even after resolution.
  // A changed decision/reason/identity for that request is FAILED_PRECONDITION, never an overwrite.
  // INVALID_ARGUMENT: missing session/execution/tool-call tuple, non-positive request_seq, or absent
  // approved. NOT_FOUND: unknown session. FAILED_PRECONDITION: stale, inherited, or wrong request
  // tuple, changed decision, or invalid recorded approval evidence. The gate cannot be created
  // for a non-stateless execution; Approve does not Describe or resolve a harness.
  // ABORTED: local contention, append-CAS conflict or superseded fence; retry
  // after reading the session. Identity is provenance only; this method provides no authorization,
  // policy hook, expiry, implicit Resume, or Cancel behavior.
  rpc Approve(ApproveRequest) returns (ApproveResponse);

  // In-flight control: cancel the running execution. Not implemented: the server returns
  // UNIMPLEMENTED.
  rpc Cancel(CancelRequest) returns (Session);

  // Compute-layer durability. There is no warm Pause: no Runtime backend implements a
  // node-local warm checkpoint, so a session goes straight from live to a cold snapshot.
  // Suspend routes an owned unreceipted approval to its recorded harness; inherited approvals
  // and ordinary sessions use their stored default. An unserved recorded name is
  // FAILED_PRECONDITION, with no fallback.
  rpc Suspend(SuspendRequest) returns (Session); // cold, free worker
  // A recorded override where either harness is REQUIRES_MEMORY_SNAPSHOT is
  // FAILED_PRECONDITION before compute changes or journal repair, as for Exec admission.
  // Otherwise an unresolved owned approval returns its current paused Session without runtime IO.
  // A call-only cut repairs the request; neither outcome proves cold compute. After a decision,
  // recovery uses the recorded invocation and SnapshotRef. It may park at another gate (without
  // RESUME), or finish and commit RESUME. A missing executor is FAILED_PRECONDITION and leaves
  // the decision recoverable. Approved executor failures are durable EXECUTOR_ERROR receipts,
  // available to the harness for continuation, not transport failures. Snapshots and unresolved
  // requests are retained indefinitely; there is no approval expiry or automatic decision.
  rpc Resume(ResumeRequest) returns (Session);

  // The differentiator: branch a session at a sequence into one or more children. Forking a
  // REQUIRES_MEMORY_SNAPSHOT harness first checkpoints the parent (it suspends, and a SUSPEND event
  // lands on its chain) because the children are cloned from that snapshot; resume brings it back.
  rpc Fork(ForkRequest) returns (ForkResponse);
}
